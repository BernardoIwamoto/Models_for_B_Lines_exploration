[project]
name = "b-lines-polygon-detection"
version = "0.1.0"
description = "Research code for quadrilateral B-Line detection with Polygon YOLO and Polygon Mask R-CNN."
requires-python = ">=3.10,<3.12"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
